<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIT Signage Studio - Login</title>
    <style>
        :root {
            --navy: #14324a;
            --blue: #1f5f99;
            --blue-hover: #184b79;
            --page: #eef2f6;
            --text: #1f2933;
            --muted: #637381;
            --border: #d8e0e8;
            --danger: #9b241b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(145deg, #e7edf3, var(--page));
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .login-shell {
            width: min(440px, 100%);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 20px 55px rgba(20, 50, 74, .16);
        }
        .login-header {
            padding: 28px 30px;
            background: var(--navy);
            color: #fff;
        }
        .login-header h1 { margin: 0; font-size: 1.65rem; }
        .login-header p { margin: 7px 0 0; color: #c7d8e6; }
        .login-body { padding: 30px; }
        .login-body h2 { margin: 0 0 5px; font-size: 1.15rem; }
        .login-body .intro { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
        label { display: block; margin: 0 0 7px; font-weight: 800; }
        input {
            width: 100%;
            min-height: 44px;
            margin-bottom: 17px;
            padding: 10px 12px;
            border: 1px solid #b8c2cc;
            border-radius: 7px;
            font: inherit;
        }
        input:focus { outline: 3px solid rgba(31, 95, 153, .18); border-color: var(--blue); }
        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 7px;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-weight: 850;
            cursor: pointer;
        }
        button:hover { background: var(--blue-hover); }
        .error, .setup-warning {
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 7px;
            line-height: 1.45;
        }
        .error { background: #fff1f0; color: var(--danger); border: 1px solid #efb2ad; }
        .setup-warning { background: #fff8e8; color: #72520d; border: 1px solid #ead08a; }
        .footer-note { margin: 20px 0 0; color: var(--muted); font-size: .83rem; text-align: center; }
    </style>
</head>
<body>
    <main class="login-shell">
        <header class="login-header">
            <h1>CPIT Signage Studio</h1>
            <p>Property Administration</p>
        </header>
        <section class="login-body">
            <h2>Administrator Login</h2>
            <p class="intro">Sign in to manage signage content, templates, uploads, and playlists.</p>

            {% if not configured %}
            <div class="setup-warning">Studio authentication has not been configured on this player yet.</div>
            {% endif %}

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('admin.login') }}">
                <input type="hidden" name="next" value="{{ next_url }}">

                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Sign In</button>
            </form>

            <p class="footer-note">CPIT Signage Studio</p>
        </section>
    </main>
</body>
</html>
